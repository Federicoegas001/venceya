spring:
  application:
    name: venceya
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/venceya}
    username: ${DB_USER:venceya}
    password: ${DB_PASSWORD:venceya}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}

venceya:
  mail:
    remitente: ${MAIL_FROM:alertas@venceya.local}
  job:
    cron: ${ALERTAS_CRON:0 0 8 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
